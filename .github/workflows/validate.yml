name: Validate data

# The gate for every change to the published data, whoever makes it: the bot workflows, the Mac's
# Council task, a Claude session or a hand edit. On a pull request it is the check to wait for
# before merging. On main it raises an issue at once, so a bad push is caught the same day.

on:
  push:
    branches: [main]
    paths: ["v1/**", "scripts/**", "tests/**", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests
        run: node --test tests/commission/autonomy.test.mjs tests/meps/meps.test.mjs tests/updates/updates.test.mjs tests/press/press.test.mjs
      - name: Validate v1 data
        run: |
          set -o pipefail
          BASE=HEAD~1
          if [ "${{ github.event_name }}" = "pull_request" ]; then git fetch -q --depth=1 origin "${{ github.base_ref }}" && BASE=FETCH_HEAD; fi
          node scripts/validate-data.mjs --base "$BASE" 2>&1 | tee validate.log
      - name: Open an issue when main fails validation
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="Data validation failed on main"
          if ! gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq ".[] | select(.title == \"$T\") | .number" | grep -q .; then
            { echo "Commit ${GITHUB_SHA::7} put data on main that fails validation:"; echo; echo '```'; tail -n 40 validate.log; echo '```'; echo; echo "Revert it or fix the data. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; } > issue.md
            gh issue create --title "$T" --label structural --body-file issue.md
          fi
      - name: Close the validation issue when main is valid again
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="Data validation failed on main"
          for N in $(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq ".[] | select(.title == \"$T\") | .number"); do
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$N/comments" -f body="Main is valid again at ${GITHUB_SHA::7}. Closed automatically." >/dev/null
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$N" -f state=closed >/dev/null
          done
