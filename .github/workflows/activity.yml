name: Update MEP activity

on:
  schedule:
    - cron: "30 3,15 * * *"
  workflow_dispatch:
    inputs:
      max_details:
        description: "Question and document details to fetch in this run (use 20000 for a full backfill)"
        default: "8000"
      skip:
        description: "Stages to skip, e.g. speech,question,role to run only the PDF text step"
        default: ""
      max_pdfs:
        description: "Number of question PDFs to read in this run"
        default: "2500"
      probe:
        description: "1 = only test how the PDF file server answers (writes data-cache/pdf-probe.json)"
        default: ""
      only:
        description: "Comma-separated MEP ids, to test with a few MEPs (leave empty for all)"
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: activity
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Build activity files
        env:
          MAX_DETAILS: ${{ inputs.max_details || '8000' }}
          ONLY: ${{ inputs.only || '' }}
          SKIP: ${{ inputs.skip || '' }}
          PROBE: ${{ inputs.probe || '' }}
          MAX_PDFS: ${{ inputs.max_pdfs || '2500' }}
        run: set -o pipefail; node scripts/build-activity.mjs 2>&1 | tee build.log
      - name: Commit changes
        if: always()
        run: |
          git config user.name "nodo-data bot"
          git config user.email "actions@users.noreply.github.com"
          # Generated files always win: save them, move to the newest main, put them back, commit.
          rm -rf "$RUNNER_TEMP/act" "$RUNNER_TEMP/dc"
          cp -r v1/activity "$RUNNER_TEMP/act" 2>/dev/null || true
          cp -r data-cache "$RUNNER_TEMP/dc" 2>/dev/null || true
          node -e 'const f=require("fs");let m={};try{m=JSON.parse(f.readFileSync("v1/manifest.json","utf8"))}catch{};f.writeFileSync(process.env.RUNNER_TEMP+"/act-entry.json",JSON.stringify((m.files&&m.files.activity)||null))'
          for i in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard origin/main
            mkdir -p v1 data-cache
            rm -rf v1/activity data-cache
            [ -d "$RUNNER_TEMP/act" ] && cp -r "$RUNNER_TEMP/act" v1/activity
            [ -d "$RUNNER_TEMP/dc" ] && cp -r "$RUNNER_TEMP/dc" data-cache
            node -e 'const f=require("fs");const e=JSON.parse(f.readFileSync(process.env.RUNNER_TEMP+"/act-entry.json","utf8"));if(e){const m=JSON.parse(f.readFileSync("v1/manifest.json","utf8"));m.files=m.files||{};m.files.activity=e;m.generated=new Date().toISOString();f.writeFileSync("v1/manifest.json",JSON.stringify(m,null,1)+"\n")}'
            git add v1 data-cache
            if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
            git commit -q -m "Update MEP activity $(date -u +%F)"
            if git push -q origin HEAD:main; then echo "Pushed."; exit 0; fi
            echo "Push rejected, retrying ($i)"; sleep 5
          done
          echo "Could not push after 4 tries"; exit 1
      - name: Open an issue when the build found a problem
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create structural --color D93F0B --description "Needs a human decision" 2>/dev/null || true
          { echo "The activity build reported a problem. Last lines of the log:"; echo; echo '```'; tail -n 40 build.log; echo '```'; echo; echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; } > issue.md
          gh issue create --title "Activity build needs attention ($(date -u +%F))" --label structural --body-file issue.md
