name: Publish health status

# Writes status.json to the `status` branch so the daily nodo check can read the
# state of every workflow, every open issue and the age of every data file from raw.githubusercontent.com.
# It runs after each data workflow finishes, so the snapshot is always as fresh as the data.
# GitHub starts scheduled runs on this repo 6–7 hours late, so the schedule below is only a backstop.

on:
  workflow_run:
    workflows: ["Update MEP activity", "Update plenary agenda", "Update Commission and cabinets", "Update file stream", "Update MEP directory"]
    types: [completed]
  schedule:
    - cron: "20 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: read

concurrency:
  group: status
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build status.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          gh api "repos/$REPO/actions/runs?per_page=100" > "$RUNNER_TEMP/runs.json"
          gh api "repos/$REPO/issues?state=open&per_page=50" > "$RUNNER_TEMP/issues.json"
          git ls-remote --heads origin 'review/*' | sed 's#.*refs/heads/##' > "$RUNNER_TEMP/branches.txt" || true
          ACT=$(ls v1/activity/*.json 2>/dev/null | wc -l)
          QF=$(ls v1/activity/q 2>/dev/null | wc -l)
          node scripts/status-data.mjs > "$RUNNER_TEMP/data.json"
          jq -n \
            --slurpfile runs "$RUNNER_TEMP/runs.json" \
            --slurpfile issues "$RUNNER_TEMP/issues.json" \
            --slurpfile data "$RUNNER_TEMP/data.json" \
            --rawfile branches "$RUNNER_TEMP/branches.txt" \
            --arg generated "$(date -u +%FT%TZ)" \
            --argjson act "$ACT" --argjson qf "$QF" \
            --arg manifest "$(jq -r '.generated // empty' v1/manifest.json)" \
            '{
              generated: $generated,
              manifestGenerated: $manifest,
              counts: { activityFiles: $act, questionFiles: $qf },
              freshness: $data[0].freshness,
              files: $data[0].files,
              manifestProblems: $data[0].manifest,
              workflows: (
                [ $runs[0].workflow_runs[]
                  | select(.name != "pages build and deployment" and .name != "Publish health status" and .status == "completed") ]
                | group_by(.name)
                | map(sort_by(.created_at) | reverse
                      | { name: .[0].name,
                          latest: { conclusion: .[0].conclusion, at: .[0].created_at, event: .[0].event, url: .[0].html_url },
                          lastSuccessAt: (map(select(.conclusion == "success")) | first | .created_at // null) })
              ),
              openIssues: [ $issues[0][] | select(.pull_request | not)
                | { number, title, labels: [.labels[].name], createdAt: .created_at, url: .html_url } ],
              reviewBranches: ($branches | split("\n") | map(select(length > 0)))
            }' > "$RUNNER_TEMP/out/status.json"
          cat "$RUNNER_TEMP/out/status.json"
      - name: Publish to the status branch
        run: |
          set -euo pipefail
          git config user.name "nodo-data bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q --orphan status
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/out/status.json" status.json
          git add status.json
          git commit -q -m "Status $(date -u +%FT%TZ)"
          git push -q -f origin status
